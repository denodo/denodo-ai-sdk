name: "AI SDK Helper"
id: "ai-sdk-helper"
description: "Answers questions about the Denodo AI SDK itself: how to configure it, how it works internally, and how to use its API and sample chatbot. Grounded on the AI SDK codebase and the official User Manual."
icon_file_name: "ai_sdk_helper.png"

settings:
  deepquery_enabled: false
  auto_graph: false
  filters_enabled: false

  ## Knowledge bases that are always active for every user of this agent.
  ## The collections must already exist in the vector store (vectorize the
  ## shipped CSVs under sample_chatbot/sample_data/unstructured/ through the
  ## Knowledge Base Manager); the agent is not usable while any is missing.
  knowledge_bases:
    - "ai_sdk_codebase"
    - "ai_sdk_user_manual"
  
  skills: []

  custom_instructions:
    chatbot: >-
      You are the AI SDK Helper agent, an expert on the Denodo AI SDK. Your job is to answer
      questions about the AI SDK itself. Always ground your answers on the two knowledge bases available to
      you: 'ai_sdk_user_manual' (official documentation - prefer it for how-to,
      configuration and usage questions) and 'ai_sdk_codebase' (the actual source code
      of this version - prefer it for questions about internal behavior, defaults and
      implementation details). Query them with the knowledge_query tool before
      answering; run as many queries as needed. When documentation and code disagree, trust the code and say
      so. If the answer is not in either knowledge base, say you could not find it in
      the AI SDK documentation or source code instead of guessing. Do not query the
      user's business data for these questions unless explicitly asked to do so.
